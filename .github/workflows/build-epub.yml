name: Build EPUB

on:
  workflow_dispatch:
  push:
    paths:
      - 'manuscrito/**'
      - 'ebook/**'
      - '.github/workflows/build-epub.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r ebook/requirements.txt

      - name: Build EPUB
        run: python ebook/build_epub.py

      - name: Upload EPUB artifact
        uses: actions/upload-artifact@v4
        with:
          name: mandaçaia-epub-teste
          path: dist/mandaçaia-melipona-quadrifasciata.epub
          if-no-files-found: error
